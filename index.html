<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markdown Viewer</title>
  
  <!-- Marked parser for Markdown conversion -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      padding: 32px 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 860px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Top Controls Bar */
    .controls {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .file-display {
      flex: 1;
      height: 42px;
      padding: 0 14px;
      border: 1.5px solid #22c55e;
      border-radius: 6px;
      background-color: #ffffff;
      font-size: 14px;
      color: #475569;
      display: flex;
      align-items: center;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .file-display.placeholder {
      color: #94a3b8;
    }

    .upload-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 42px;
      padding: 0 20px;
      border: 2px solid #2563eb;
      border-radius: 12px;
      background-color: #ffffff;
      color: #2563eb;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .upload-btn:hover {
      background-color: #eff6ff;
    }

    #mdFileInput {
      display: none;
    }

    /* Rendered Content Box */
    .preview-box {
      min-height: 520px;
      border: 1.5px solid #0f172a;
      border-radius: 8px;
      background-color: #ffffff;
      padding: 32px 40px;
      line-height: 1.65;
    }

    .empty-state {
      color: #94a3b8;
      text-align: center;
      margin-top: 180px;
      font-size: 15px;
    }

    /* Markdown Styling */
    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4 {
      color: #0f172a;
      margin-top: 24px;
      margin-bottom: 12px;
      font-weight: 600;
      line-height: 1.3;
    }

    .markdown-body h1 {
      font-size: 1.8rem;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 8px;
    }

    .markdown-body h2 {
      font-size: 1.4rem;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 6px;
    }

    .markdown-body h3 { font-size: 1.15rem; }
    .markdown-body p { margin-bottom: 14px; }
    .markdown-body ul, 
    .markdown-body ol { margin-bottom: 14px; padding-left: 24px; }
    .markdown-body li { margin-bottom: 4px; }

    .markdown-body blockquote {
      border-left: 4px solid #cbd5e1;
      padding: 4px 0 4px 16px;
      color: #64748b;
      margin-bottom: 14px;
    }

    .markdown-body code {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.88em;
      background-color: #f1f5f9;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .markdown-body pre {
      background-color: #0f172a;
      color: #f8fafc;
      padding: 16px;
      border-radius: 6px;
      overflow-x: auto;
      margin-bottom: 14px;
    }

    .markdown-body pre code {
      background-color: transparent;
      padding: 0;
      color: inherit;
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 16px;
    }

    .markdown-body th,
    .markdown-body td {
      border: 1px solid #cbd5e1;
      padding: 8px 12px;
      text-align: left;
    }

    .markdown-body th {
      background-color: #f8fafc;
    }

    .markdown-body hr {
      border: 0;
      border-top: 1px solid #e2e8f0;
      margin: 20px 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Top Selector Bar -->
    <div class="controls">
      <div id="fileName" class="file-display placeholder">No file chosen</div>
      
      <label class="upload-btn" for="mdFileInput">choose MD file</label>
      <input type="file" id="mdFileInput" accept=".md, .markdown, text/markdown, text/plain" />
    </div>

    <!-- Rendered Markdown Viewport -->
    <div id="preview" class="preview-box">
      <div class="empty-state">Select a Markdown (.md) file to display its contents.</div>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('mdFileInput');
    const fileNameDisplay = document.getElementById('fileName');
    const preview = document.getElementById('preview');

    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (!file) return;

      fileNameDisplay.textContent = file.name;
      fileNameDisplay.classList.remove('placeholder');

      const reader = new FileReader();
      reader.onload = (e) => {
        const markdownText = e.target.result;
        preview.className = 'preview-box markdown-body';
        preview.innerHTML = marked.parse(markdownText);
      };

      reader.readAsText(file);
    });
  </script>

</body>
</html>
